# Static hosting for the exported city. Hashed build assets are cached for a year;
# HTML revalidates on every visit so new deploys show up immediately.
map $uri $cache_control {
    ~^/_next/static/  "public, max-age=31536000, immutable";
    default           "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cloudflare-only header rules; nginx sets its headers above.
    location = /_headers {
        return 404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
